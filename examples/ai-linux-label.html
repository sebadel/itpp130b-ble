<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Linux BLE Printer Demo</title>
  <style>
    @page { size: 150mm 100mm; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 150mm; height: 100mm; }
    body {
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
      padding: 8mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .eyebrow {
      font-size: 10pt;
      font-weight: 700;
      letter-spacing: 2pt;
      text-transform: uppercase;
    }
    .logos {
      display: flex;
      gap: 7mm;
      align-items: center;
    }
    .logos img { display: block; object-fit: contain; }
    .logo-openwatt { width: 42mm; height: 10mm; }
    .logo-omarchy { width: 36mm; height: 11mm; }
    .logo-opencode { width: 30mm; height: 10mm; }
    h1 {
      font-size: 31pt;
      line-height: .96;
      margin: 5mm 0 3mm;
      max-width: 125mm;
    }
    .accent { color: #1746d1; }
    footer {
      border-top: 1.5pt solid #111;
      padding-top: 3mm;
      display: flex;
      justify-content: space-between;
      align-items: end;
      font-size: 8pt;
      font-weight: 700;
      letter-spacing: .6pt;
    }
    .link { font-family: monospace; letter-spacing: 0; }
  </style>
</head>
<body>
  <div>
    <div class="logos">
      <img class="logo-openwatt" src="./logos/openwatt.png" alt="OpenWatt">
      <img class="logo-omarchy" src="./logos/omarchy.png" alt="Omarchy">
      <img class="logo-opencode" src="./logos/opencode.png" alt="OpenCode">
    </div>
    <h1>No Linux driver,<br><span class="accent">have an agent write it for you</span></h1>
  </div>
  <footer>
    <div>$2 on OpenCode Go<br>and 1 hour later</div>
    <div class="link">github.com/sebadel/itpp130b-ble</div>
  </footer>
</body>
</html>
